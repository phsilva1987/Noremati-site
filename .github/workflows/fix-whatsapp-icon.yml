name: Fix WhatsApp Icon

on:
  push:
    paths:
      - '.github/workflows/fix-whatsapp-icon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace WhatsApp icons
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old1 = '<path d="M20.5 11.5a8.5 8.5 0 0 1-12.6 7.45L3 20l1.1-4.65A8.5 8.5 0 1 1 20.5 11.5Z"/>\n              <path d="M8.5 8.5c.5 2 2.5 4 4.5 5l1.5-1"/>'
          old2 = '<path d="M20.5 11.5a8.5 8.5 0 0 1-12.6 7.45L3 20l1.1-4.65A8.5 8.5 0 1 1 20.5 11.5Z"/>\n    <path d="M8.5 8.5c.5 2 2.5 4 4.5 5l1.5-1"/>'
          glyph = '<path fill="currentColor" stroke="none" d="M12 2a9.84 9.84 0 0 0-8.4 14.96L2.05 22l5.18-1.52A9.96 9.96 0 1 0 12 2Zm0 17.93a8.02 8.02 0 0 1-4.09-1.12l-.29-.17-3.07.9.92-2.98-.19-.3A7.87 7.87 0 1 1 12 19.93Zm4.39-5.9c-.24-.12-1.42-.7-1.64-.77-.22-.08-.38-.12-.54.12-.16.24-.63.77-.77.93-.14.16-.28.18-.52.06-.24-.12-1.02-.37-1.94-1.18a7.28 7.28 0 0 1-1.34-1.65c-.14-.24-.01-.37.1-.49.11-.1.24-.27.36-.41.12-.14.16-.24.24-.39.08-.16.04-.3-.02-.42-.06-.12-.54-1.31-.75-1.79-.2-.48-.4-.41-.54-.42h-.47c-.16 0-.42.06-.64.3-.22.24-.85.82-.85 2s.87 2.32.99 2.48c.12.16 1.72 2.59 4.16 3.63.58.25 1.04.4 1.39.51.58.18 1.11.16 1.53.1.47-.07 1.42-.57 1.62-1.12.2-.55.2-1.02.14-1.12-.06-.1-.22-.16-.46-.28Z"/>'
          n = s.count(old1) + s.count(old2)
          if n == 0:
              raise SystemExit('old WhatsApp paths not found')
          s = s.replace(old1, glyph).replace(old2, glyph)
          s = s.replace('.whatsapp-float svg{width:25px;height:25px;stroke:currentColor;fill:none}', '.whatsapp-float svg{width:29px;height:29px;display:block;fill:currentColor;stroke:none}')
          p.write_text(s, encoding='utf-8')
          print('updated icons:', n)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git commit -m 'fix WhatsApp icon rendering'
          git push
