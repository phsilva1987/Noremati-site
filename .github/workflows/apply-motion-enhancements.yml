name: Apply Noremati Motion Enhancements

on:
  push:
    paths:
      - .github/workflows/apply-motion-enhancements.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply motion-only patch
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'NOREMATI_MOTION_PATCH_V1'
          if marker in s:
              raise SystemExit(0)

          css = r'''
    /* NOREMATI_MOTION_PATCH_V1 — motion only; layout/content/WhatsApp untouched */
    :root{--motion-ease:cubic-bezier(.22,1,.36,1)}
    header{transition:background-color .35s var(--motion-ease),box-shadow .35s var(--motion-ease)}
    header.is-scrolled{background:rgba(255,253,248,.985);box-shadow:0 10px 32px rgba(51,38,23,.08)}
    .btn{transition:transform .3s var(--motion-ease),box-shadow .3s var(--motion-ease),background-color .3s var(--motion-ease)}
    .btn:hover{transform:translateY(-2px)}
    .motion-reveal{opacity:0;transform:translateY(28px);transition:opacity .85s var(--motion-ease),transform .85s var(--motion-ease)}
    .motion-reveal.is-visible{opacity:1;transform:none}
    .motion-stagger-2{transition-delay:.08s}.motion-stagger-3{transition-delay:.16s}.motion-stagger-4{transition-delay:.24s}
    .portrait,.studio-view img,.hero-photo img{transition:transform .7s var(--motion-ease),box-shadow .7s var(--motion-ease)}
    @media(hover:hover) and (pointer:fine){.person:hover .portrait{transform:translateY(-4px) scale(1.012);box-shadow:0 24px 48px rgba(51,38,23,.13)}.studio-view:hover img{transform:scale(1.018)}.hero-photo:hover img{transform:scale(1.008)}}
    @media(prefers-reduced-motion:reduce){.motion-reveal{opacity:1!important;transform:none!important;transition:none!important}.btn,.portrait,.studio-view img,.hero-photo img,header{transition:none!important}}
'''
          js = r'''
<script>
(function(){
  'use strict';
  var reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var header=document.querySelector('header');
  var navLinks=Array.prototype.slice.call(document.querySelectorAll('.navlinks a[href^="#"]'));

  /* Smooth section navigation with fixed-header compensation. */
  navLinks.concat(Array.prototype.slice.call(document.querySelectorAll('a[href^="#"]'))).filter(function(v,i,a){return a.indexOf(v)===i;}).forEach(function(link){
    link.addEventListener('click',function(e){
      var href=link.getAttribute('href'); if(!href||href==='#')return;
      var target=document.querySelector(href); if(!target)return;
      e.preventDefault();
      var top=target.getBoundingClientRect().top+window.pageYOffset-(header?header.offsetHeight:0);
      window.scrollTo({top:top,behavior:reduceMotion?'auto':'smooth'});
      history.replaceState(null,'',href);
    });
  });

  /* Reveal + stagger. Classes are added at runtime: HTML/content stays untouched. */
  var selectors=['.lineage-grid .person','.classic-copy','.features .feature','.studio-head','.studio-view','.studio-panel','.faq h2','.faq-item','.cta-copy'];
  var els=[];
  selectors.forEach(function(sel){document.querySelectorAll(sel).forEach(function(el){if(els.indexOf(el)<0)els.push(el);});});
  els.forEach(function(el,i){el.classList.add('motion-reveal');});
  ['.lineage-grid','.features','.faq-list'].forEach(function(groupSel){document.querySelectorAll(groupSel).forEach(function(group){Array.prototype.forEach.call(group.children,function(el,i){if(i>0&&i<4)el.classList.add('motion-stagger-'+(i+1));});});});
  if(reduceMotion||!('IntersectionObserver' in window)){els.forEach(function(el){el.classList.add('is-visible');});}
  else{var io=new IntersectionObserver(function(entries,obs){entries.forEach(function(entry){if(entry.isIntersecting){entry.target.classList.add('is-visible');obs.unobserve(entry.target);}});},{threshold:.12,rootMargin:'0px 0px -40px 0px'});els.forEach(function(el){io.observe(el);});}

  /* Header depth + active menu item while scrolling. */
  var sections=navLinks.map(function(l){return document.querySelector(l.getAttribute('href'));}).filter(Boolean), ticking=false;
  function update(){ticking=false;var y=window.scrollY; if(header)header.classList.toggle('is-scrolled',y>10);var offset=(header?header.offsetHeight:0)+90,current=null;sections.forEach(function(sec){if(sec.getBoundingClientRect().top<=offset)current=sec;});navLinks.forEach(function(l){var active=!!current&&l.getAttribute('href')==='#'+current.id;l.classList.toggle('active',active);if(active)l.setAttribute('aria-current','true');else l.removeAttribute('aria-current');});}
  window.addEventListener('scroll',function(){if(!ticking){ticking=true;requestAnimationFrame(update);}},{passive:true});
  window.addEventListener('resize',update,{passive:true}); update();
})();
</script>
'''
          if '</style>' not in s or '</body>' not in s:
              raise SystemExit('Expected HTML anchors not found; no changes applied.')
          s = s.replace('</style>', css + '\n  </style>', 1)
          s = s.replace('</body>', js + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate scope and commit
        run: |
          grep -q 'NOREMATI_MOTION_PATCH_V1' index.html
          grep -q 'whatsapp-float' index.html
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: add subtle section motion and navigation transitions"
          git push
