name: Apply Noremati motion enhancements

on:
  push:
    paths:
      - '.github/workflows/apply-motion-enhancements.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply approved motion patch
        shell: python {0}
        run: |
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          html = html.replace('        <a href="https://www.instagram.com/norematipilates/" target="_blank" rel="noopener" aria-label="Instagram Noremati">@norematipilates</a>\n', '')

          css = r'''

    /* Motion enhancements — preserva layout, conteúdo e funcionalidades */
    :root{--motion-ease:cubic-bezier(.22,1,.36,1)}
    header{transition:background-color .35s var(--motion-ease),box-shadow .35s var(--motion-ease),border-color .35s var(--motion-ease)}
    header.is-scrolled{background:rgba(255,253,248,.985);box-shadow:0 10px 32px rgba(51,38,23,.08);border-bottom-color:rgba(167,122,52,.18)}
    .navlinks a{position:relative;transition:color .28s var(--motion-ease),background-color .28s var(--motion-ease),box-shadow .28s var(--motion-ease),transform .28s var(--motion-ease)}
    .navlinks a:hover{transform:translateY(-1px)}
    .navlinks a::after{content:"";position:absolute;left:18px;right:18px;bottom:4px;height:1px;background:var(--gold);transform:scaleX(0);transform-origin:center;transition:transform .32s var(--motion-ease)}
    .navlinks a.active::after,.navlinks a:hover::after{transform:scaleX(1)}
    .btn{transition:transform .3s var(--motion-ease),box-shadow .3s var(--motion-ease),background-color .3s var(--motion-ease)}
    .btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(112,78,27,.24)}
    .portrait,.hero-photo img,.studio-view img{transition:transform .7s var(--motion-ease),box-shadow .7s var(--motion-ease)}
    @media(hover:hover) and (pointer:fine){
      .person:hover .portrait{transform:translateY(-4px) scale(1.012);box-shadow:0 24px 48px rgba(51,38,23,.13)}
      .hero-photo:hover img{transform:scale(1.012)}
      .studio-view:hover img{transform:scale(1.018)}
    }
    .reveal{opacity:0;transform:translateY(30px);transition:opacity .85s var(--motion-ease),transform .85s var(--motion-ease)}
    .reveal.is-visible{opacity:1;transform:translateY(0)}
    .benefit-grid .reveal:nth-child(2),.steps .reveal:nth-child(2),.trust-grid .reveal:nth-child(2){transition-delay:.08s}
    .benefit-grid .reveal:nth-child(3),.steps .reveal:nth-child(3),.trust-grid .reveal:nth-child(3){transition-delay:.16s}
    .benefit-grid .reveal:nth-child(4),.trust-grid .reveal:nth-child(4){transition-delay:.24s}
    .whatsapp-float.motion-ready{animation:whatsappEntrance .65s var(--motion-ease) both}
    .whatsapp-float.motion-ready::after{content:"";position:absolute;inset:-5px;border:1px solid rgba(143,106,46,.32);border-radius:50%;animation:whatsappPulse 1.8s ease-out 1 .7s;pointer-events:none}
    @keyframes whatsappEntrance{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes whatsappPulse{0%{opacity:.8;transform:scale(.88)}100%{opacity:0;transform:scale(1.45)}}
    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      header,.navlinks a,.btn,.portrait,.hero-photo img,.studio-view img,.reveal,.whatsapp-float{transition:none!important;animation:none!important}
      .reveal{opacity:1;transform:none}
    }
'''

          if 'Motion enhancements — preserva layout' not in html:
              html = html.replace('\n</style>', css + '\n</style>', 1)

          js = r'''

<script>
(function(){
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const header = document.querySelector('header');
  const navLinks = Array.from(document.querySelectorAll('.navlinks a[href^="#"]'));
  const anchorLinks = document.querySelectorAll('a[href^="#"]');

  const updateHeader = () => header && header.classList.toggle('is-scrolled', window.scrollY > 10);
  updateHeader();
  window.addEventListener('scroll', updateHeader, {passive:true});

  if(!reduceMotion){
    anchorLinks.forEach(link => {
      link.addEventListener('click', function(e){
        const href = this.getAttribute('href');
        if(!href || href === '#') return;
        const target = document.querySelector(href);
        if(!target) return;
        e.preventDefault();
        const headerHeight = header ? header.offsetHeight : 0;
        const top = target.getBoundingClientRect().top + window.scrollY - headerHeight + 1;
        window.scrollTo({top, behavior:'smooth'});
        history.replaceState(null, '', href);
      });
    });
  }

  const sections = navLinks.map(link => document.querySelector(link.getAttribute('href'))).filter(Boolean);
  const syncActive = () => {
    if(!sections.length) return;
    const offset = (header ? header.offsetHeight : 0) + 90;
    let current = sections[0];
    sections.forEach(section => { if(section.getBoundingClientRect().top <= offset) current = section; });
    navLinks.forEach(link => link.classList.toggle('active', link.getAttribute('href') === '#' + current.id));
  };
  syncActive();
  window.addEventListener('scroll', syncActive, {passive:true});

  const whatsapp = document.querySelector('.whatsapp-float');
  if(whatsapp && !reduceMotion){ requestAnimationFrame(() => whatsapp.classList.add('motion-ready')); }
})();
</script>
'''

          if 'const reduceMotion' not in html:
              html = html.replace('\n</body>', js + '\n</body>', 1)

          path.write_text(html, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "feat: restore smooth motion and simplify Instagram footer"
          git push
