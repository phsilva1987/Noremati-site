name: Apply Noremati Motion Enhancements

on:
  push:
    paths:
      - .github/workflows/apply-motion-enhancements.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix floating WhatsApp icon
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Keep footer/layout untouched. Replace only the SVG inside the floating WhatsApp button.
          official_icon = '''<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <path fill="currentColor" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.149-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.521.149-.173.198-.297.298-.495.099-.198.05-.372-.025-.521-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.009-.371-.011-.57-.011-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479s1.065 2.875 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.262.489 1.693.625.712.227 1.36.195 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.981.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26C2.169 6.455 6.596 2.03 12.04 2.03c2.637 0 5.116 1.028 6.978 2.893a9.825 9.825 0 0 1 2.889 6.988c-.003 5.44-4.43 9.866-9.856 9.866m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.14 1.588 5.945L.056 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.478-8.413Z"/>
  </svg>'''

          pattern = r'(<a class="whatsapp-float"[^>]*>\s*)<svg[\s\S]*?</svg>(\s*</a>)'
          s, count = re.subn(pattern, lambda m: m.group(1) + official_icon + m.group(2), s, count=1)
          if count != 1:
              raise SystemExit('Floating WhatsApp button not found; no changes applied.')

          # Solid official glyph, centered and visually balanced.
          s = re.sub(r'\.whatsapp-float svg\{[^}]*\}', '.whatsapp-float svg{width:27px;height:27px;display:block;fill:currentColor;stroke:none}', s, count=1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: use official WhatsApp glyph on floating button"
          git push
