name: Apply Noremati Motion Enhancements

on:
  push:
    paths:
      - .github/workflows/apply-motion-enhancements.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply motion-only patch
        env:
          PATCH_B64: 
        run: echo "$PATCH_B64" | base64 -d | python3
      - name: Validate and commit
        run: |
          grep -q 'NOREMATI_MOTION_PATCH_V1' index.html
          grep -q 'whatsapp-float' index.html
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: add subtle section motion and navigation transitions"
          git push
