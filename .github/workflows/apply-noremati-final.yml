name: Apply Noremati final index

on:
  push:
    branches: [main]
    paths:
      - '.deploy/index.gz.b64'
      - '.github/workflows/apply-noremati-final.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore approved index
        shell: bash
        run: |
          base64 -d .deploy/index.gz.b64 | gzip -d > index.html

      - name: Validate approved index
        shell: bash
        run: |
          grep -q 'AGENDE SUA AULA GRÁTIS' index.html
          grep -q 'CONHECER O PILATES CLÁSSICO' index.html
          grep -q 'NOREMATI · PILATES CLÁSSICO EM SANTOS' index.html

      - name: Commit approved index
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index changes'
            exit 0
          fi
          git commit -m 'deploy approved Noremati production index'
          git push
