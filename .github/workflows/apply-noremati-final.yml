name: Patch Noremati WhatsApp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-noremati-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch only floating WhatsApp button
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          token_old = '--gold:#a77a34;--gold-btn:#8f6a2e;--gold2:#c6a260;--line:#dfd1bd;--dark:#2d2116;'
          token_new = token_old + '--wa-green:#25D366;--wa-green-hover:#1EBE5A;'
          if '--wa-green:#25D366' not in s:
              if token_old not in s:
                  raise SystemExit('WhatsApp token insertion point not found')
              s = s.replace(token_old, token_new, 1)

          css_start = s.index('    .whatsapp-float{')
          css_end = s.index('    .mobile-cta{display:none}', css_start)
          css = '''    .whatsapp-float{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:60;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--wa-green);color:#fff;text-decoration:none;border:0;outline:0;box-shadow:0 8px 22px rgba(18,140,70,.30);transition:transform .2s ease,box-shadow .2s ease,background-color .2s ease}\n    .whatsapp-float:hover{background:var(--wa-green-hover);transform:translateY(-2px);box-shadow:0 12px 26px rgba(18,140,70,.36)}\n    .whatsapp-float::before,.whatsapp-float::after{content:none!important;display:none!important}\n    .whatsapp-float svg{width:30px;height:30px;display:block;fill:currentColor;stroke:none}\n'''
          s = s[:css_start] + css + s[css_end:]

          a_start = s.index('<a class="whatsapp-float"')
          a_end = s.index('</a>', a_start) + 4
          button = '''<a class="whatsapp-float" href="https://wa.me/5511981346510" data-booking-open aria-label="Falar com a Fabiana pelo WhatsApp" title="WhatsApp">\n  <svg viewBox="0 0 24 24" aria-hidden="true">\n    <path fill="currentColor" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/>\n  </svg>\n</a>'''
          s = s[:a_start] + button + s[a_end:]

          if 'background:var(--wa-green)' not in s:
              raise SystemExit('Green WhatsApp button validation failed')
          if 'M17.472 14.382' not in s[a_start:a_start+2500]:
              raise SystemExit('Official WhatsApp glyph validation failed')

          p.write_text(s, encoding='utf-8')

      - name: Commit WhatsApp patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index changes'
            exit 0
          fi
          git commit -m 'fix: use official WhatsApp icon'
          git push
